/* Layout: thân máy đen, viền xanh như mặt trạm sạc; lưới thẻ sản phẩm, thanh liên hệ cố định ở đáy trên mobile */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0B1220; --muted:#526075; --line:#D9E1EC;
  --brand:#2B3894; --accent:#2B3894; --accent-ink:#FFFFFF; --glow:#2FA8FF; --panel:#0C121C; --panel-ink:#E8F1FF; --ok:#14935B; --warn:#B86E00;
  --amber:#FFB81C; --amber-ink:#1F1400; --brand-soft:#E9ECFB; --brand-deep:#141B5C; --night:#070A1C;
  --f-display:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080C13; --surface:#101722; --ink:#E8EEF7; --muted:#93A1B5; --line:#1F2A3A;
  --brand:#AEB9FF; --accent:#8D9BFF; --accent-ink:#0A0F2E; --glow:#4FB6FF; --panel:#050910; --panel-ink:#E8F1FF; --ok:#3CCB8A; --warn:#F0A63A; --amber:#FFC23D; --amber-ink:#1F1400; --brand-soft:#11163A; --brand-deep:#141B5C; --night:#04060F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C13; --surface:#101722; --ink:#E8EEF7; --muted:#93A1B5; --line:#1F2A3A;
  --brand:#AEB9FF; --accent:#8D9BFF; --accent-ink:#0A0F2E; --glow:#4FB6FF; --panel:#050910; --panel-ink:#E8F1FF; --ok:#3CCB8A; --warn:#F0A63A; --amber:#FFC23D; --amber-ink:#1F1400; --brand-soft:#11163A; --brand-deep:#141B5C; --night:#04060F; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
.pd>*,.hero .wrap>*,.two>*,.grid>*{min-width:0}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.logo{display:block;width:132px;aspect-ratio:2273/336;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

.nav{display:flex;gap:4px}
.nav a{text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:8px;color:var(--muted)}
.nav a.on,.nav a:hover{color:var(--ink);background:var(--surface)}
.hot{display:none;font:600 15px/1 var(--f-display);text-decoration:none;color:var(--accent)}
@media (min-width:760px){.hot{display:inline}}
.nav a{white-space:nowrap}
@media (max-width:560px){.nav a{padding:8px 7px;font-size:13.5px}.top .logo{width:100px}.top .wrap{gap:8px}}

/* hero: mặt máy */
.hero{background:var(--panel);color:var(--panel-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding-block:56px}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--glow)}
.hero p{color:#A9B8CC;max-width:46ch;margin:16px 0 24px;font-size:17px}
.lcd{display:inline-flex;gap:18px;align-items:baseline;border:1px solid #1E3A5F;border-radius:8px;padding:10px 16px;background:#060B12;margin-bottom:22px;box-shadow:inset 0 0 0 1px #0F2238}
.lcd span{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;color:#F4F8FF}
.lcd small{display:block;font:500 10px/1.2 var(--f-body);color:#6F86A3;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.lcd .pct{color:var(--glow)}
.hero img{filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:36px 28px}.hero img{width:100%;max-width:520px;margin:0 auto}}

.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r);font:600 15px/1 var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-pri{background:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{filter:brightness(1.08)}
.btn-ghost{border-color:currentColor;background:transparent;color:inherit}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px}

section.blk{padding-block:56px}
.blk-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.blk-head h2{font-size:clamp(24px,3.2vw,34px);margin-top:8px}

/* lý do */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.why div{border-top:2px solid var(--accent);padding-top:14px}
.why h3{font-size:18px;margin-bottom:6px}
.why p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:820px){.why{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.why{grid-template-columns:1fr}}

/* thẻ sản phẩm */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ph{background:var(--panel);aspect-ratio:4/3;display:grid;place-items:center;padding:18px;position:relative}
.card .ph img{max-height:100%;object-fit:contain}
.badge{position:absolute;top:12px;left:12px;font:600 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--glow);color:#03101F;padding:6px 8px;border-radius:5px}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:19px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.specs div{background:var(--bg);border-radius:8px;padding:8px 10px}
.specs dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.specs dd{margin:0;font:600 16px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.price{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price strong{font:700 18px/1 var(--f-display);color:var(--accent)}
.price span{font-size:14px;color:var(--muted)}

/* bộ lọc */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px/1 var(--f-body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* chi tiết */
.crumb{font-size:14px;color:var(--muted);padding-block:18px 0}
.crumb a{text-decoration:none}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding-block:20px 48px}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:20px}}
.pd .ph{background:var(--panel);border-radius:16px;padding:28px;display:grid;place-items:center;aspect-ratio:4/3}
.pd .ph img{max-height:100%;object-fit:contain}
.pd h1{font-size:clamp(26px,3.6vw,38px)}
.pd .lead{color:var(--muted);margin:8px 0 18px}
.lbl{font:600 13px/1 var(--f-body);color:var(--muted);margin:18px 0 8px}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.var{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;font:inherit}
.var b{display:block;font:600 15px/1.2 var(--f-display)}
.var small{color:var(--muted);font-size:13px}
.var.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pd .price{margin:20px 0 16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ports{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.ports li{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td,tr:last-child th{border-bottom:0}
th{color:var(--muted);font-weight:500;width:42%}
td{font-variant-numeric:tabular-nums}

/* công cụ tính thời gian */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.calc h3{font-size:20px}
.calc p.hint{color:var(--muted);font-size:14px;margin:4px 0 14px}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.dev{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;font-size:14px}
.dev .w{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
.qty output{width:22px;text-align:center;font-family:var(--f-display);font-weight:600}
.result{display:flex;flex-wrap:wrap;gap:24px;align-items:baseline;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.result .big{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.result .note{font-size:13px;color:var(--muted);flex-basis:100%}
.result .over{color:var(--warn);font-weight:600}

/* liên hệ / đặt hàng */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

.faq details{border-bottom:1px solid var(--line);padding:14px 0}

footer{border-top:1px solid var(--line);padding-block:28px 96px;color:var(--muted);font-size:14px}

/* thanh liên hệ mobile */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;
  padding:10px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line)}

.hero{background:radial-gradient(55% 75% at 76% 48%,rgba(47,168,255,.30),transparent 62%),radial-gradient(40% 50% at 10% 0%,rgba(255,184,28,.12),transparent 70%),linear-gradient(140deg,#1B2472 0%,#0B1035 48%,var(--night) 100%)}
.hero::after{background:linear-gradient(90deg,transparent,var(--glow) 30%,var(--amber) 70%,transparent)}

.lcd{border-color:#2A3C8F;background:rgba(4,8,24,.7)}
.lcd .pct{color:var(--amber)}
.hero .btn-pri{background:var(--amber);color:var(--amber-ink)}
.hero .btn-ghost{color:#E8F1FF;border-color:rgba(232,241,255,.45)}
.band{background:var(--brand-soft)}
.why div{border-top:0;padding:20px;background:var(--surface);border-radius:14px;display:grid;gap:6px;align-content:start}

.card .ph,.pd .ph{background:radial-gradient(70% 70% at 50% 45%,rgba(47,168,255,.22),transparent 70%),linear-gradient(160deg,#18205E,var(--night) 75%)}
.badge{background:var(--amber);color:var(--amber-ink)}
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}

.chip.on{background:var(--brand);color:var(--accent-ink);border-color:var(--brand)}
.calc{border:0;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--glow),var(--accent),var(--amber)) border-box;border:2px solid transparent}
.result .big{background:linear-gradient(90deg,var(--accent),var(--glow));-webkit-background-clip:text;background-clip:text;color:transparent}
.dock a.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.pd .btn-pri,.form .btn-pri{background:var(--amber);color:var(--amber-ink)}
footer{background:var(--brand-deep);color:#C5CCF2;border-top:3px solid var(--amber)}

/* ===== lượt 3: theo frontend-design. Điểm nhấn duy nhất là hàng 6 máy xếp theo chiều cao thật trong hero; phần còn lại tiết chế ===== */
.hero{background:linear-gradient(180deg,var(--brand-deep) 0%,var(--night) 100%)}
.hero::after{display:none}
.hero .wrap{display:block;padding-block:56px 28px}
.hero-copy{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end}

.hero-copy p{margin:0 0 20px;max-width:44ch;color:#B9C4E4}
.lineup{--k:.62px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:44px;padding-bottom:14px;overflow-x:auto;border-bottom:1px solid rgba(232,241,255,.2)}

.lu:hover .lu-w,.lu:focus-visible .lu-w{color:var(--amber)}
.hero .lu-note{font-size:13px;line-height:1.5;color:#8796C2;margin:12px 0 0;max-width:none}
@media (max-width:820px){.hero-copy{grid-template-columns:1fr;gap:16px}.hero .wrap{padding-block:36px 24px}.lineup{--k:.5px;justify-content:flex-start;gap:18px}}
.why div{background:transparent;padding:0}
.why .ic{border-radius:50%}
.uses{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
@media (max-width:720px){.uses{grid-template-columns:1fr}}
.use{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
.use-ph{background:var(--night);border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;padding:8px}
.use-tx{display:grid;gap:2px}
.use-tx strong{font-size:18px}
.use-tx span{color:var(--muted);font-size:15px}
.use-tx em{font-style:normal;font-weight:600;font-size:14px;color:var(--accent);margin-top:4px}

.uses-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.uses-ph{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.uses-ph{grid-template-columns:1fr}}
.upc{display:grid;gap:10px;text-decoration:none;color:inherit}
.upc img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--panel);transition:transform .25s}
.upc:hover img{transform:scale(1.015)}
.upc strong{font-size:18px;display:block}
.upc span{color:var(--muted);font-size:15px}
.upc em{font-style:normal;font-weight:600;font-size:14px;color:var(--accent)}
.upc:hover strong{color:var(--accent)}
.pd .ph.photo{padding:0;overflow:hidden}
.pd .ph.photo img{width:100%;height:100%;max-height:none;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{flex:0 0 76px;height:58px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.card{transition:border-color .2s}
.card:hover{transform:none}
.card .ph,.pd .ph{background:var(--night)}
.badge{text-transform:none;letter-spacing:0;font-size:12px}
.specs dt{text-transform:none;letter-spacing:0;font-size:12px}
.calc{background:var(--surface);border:1px solid var(--line)}
.result .big{background:none;color:var(--accent)}
.ask{background:var(--amber);color:var(--amber-ink)}
.ask .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-block:36px}
.ask h2{font-size:clamp(24px,3vw,32px)}
.ask p{margin:6px 0 0;max-width:52ch}
.ask .btn-pri{background:var(--amber-ink);color:#FFFFFF}
.ask .btn-ghost{color:var(--amber-ink)}
footer{border-top:0}
.pol{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.pol li{padding-left:18px;position:relative}
.pol li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pol b{color:var(--ink);font-weight:600}
.ft-pol{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:right}
@media (max-width:560px){.ft-pol{text-align:left}}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:1}
.badges .badge{position:static}
.sold{margin:-8px 0 12px;font-size:14px;font-weight:600;color:var(--accent)}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.revs{grid-template-columns:1fr}}
.rev{margin:0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:10px;align-content:start}
.rev blockquote{margin:0;font-size:15px}
.rev figcaption{font-size:14px;display:grid}
.rev figcaption span{color:var(--muted);font-size:13px}
.stars{color:var(--amber);letter-spacing:2px}.stars span{color:var(--line)}
a,button,.chip,.var{cursor:pointer}

/* ===== thẻ máy kiểu "nổi bật máy bán chạy" (user chọn mẫu 3, 2026-10-16) ===== */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.bento.list{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.bento,.bento.list{grid-template-columns:1fr 1fr}}
.tl{border-radius:20px;overflow:hidden;background:radial-gradient(70% 60% at 70% 40%,rgba(79,182,255,.16),transparent 70%),linear-gradient(160deg,#18205E,#070A1C 75%);border:1px solid rgba(141,155,255,.2);padding:18px;display:grid;gap:8px;align-content:start;text-decoration:none;color:#F2F5FF;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.tl:hover{transform:translateY(-6px);border-color:rgba(255,194,61,.55);box-shadow:0 22px 40px -22px rgba(47,168,255,.55)}
.tl img{width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.6));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tl:hover img{transform:scale(1.05) rotate(-1deg)}
.tl .tg{display:flex;gap:6px;min-height:24px}
.tl .tg span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--amber);color:var(--amber-ink)}
.tl .tg span.o{background:transparent;color:#4FB6FF;border:1px solid rgba(79,182,255,.5)}
.tl h3{margin:4px 0 0;font-size:18px;color:#FFFFFF}
.tl .wh{font-weight:800;font-size:20px;color:#FFFFFF;font-variant-numeric:tabular-nums}
.tl .cds{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tl .cds b{white-space:nowrap;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(141,155,255,.14);border:1px solid rgba(141,155,255,.3);color:#FFFFFF}
.tl.big .cds b{font-size:16px;padding:5px 11px}
.tl .wh small{display:block;font-size:12px;font-weight:500;color:#AEB9D6}
.tl .m{color:#AEB9D6;font-size:14px;margin:6px 0 10px}
.tl .go{display:inline-flex;align-self:start;justify-self:start;margin-top:6px;font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px;background:var(--amber);color:var(--amber-ink)}
.tl .sm{font-size:13px;color:#FFC23D;font-weight:600}
.tl.big{grid-column:span 2;grid-template-columns:1fr 1.25fr;align-items:center;gap:20px;padding:26px}
.tl.big img{order:2}
.tl.wide{grid-column:1/-1;grid-template-columns:1fr 1.5fr}
.tl.wide img{max-height:360px;object-fit:cover}
.tl.big h3{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;line-height:1.1}
.tl.big .wh{font-size:28px;margin-bottom:6px}
@media (max-width:560px){.tl.big{grid-template-columns:1fr;padding:20px}.tl.big img{order:0}.tl{padding:14px}.tl h3{font-size:16px}.tl .wh{font-size:17px}}

/* ===== hiệu ứng động: trượt khi cuộn, lướt khi rê chuột, rung nhẹ ở nút mua ===== */
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.rv-l{transform:translateX(-36px)}.rv.rv-r{transform:translateX(36px)}
.rv.in{opacity:1;transform:none}
@keyframes luIn{from{opacity:0;transform:translateY(60px) scale(.92)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lu{animation:luIn .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * .09s + .1s)}
.lu img{animation:floaty 4.5s ease-in-out infinite;animation-delay:calc(var(--i) * -.7s)}
.lu img{transition:translate .3s, scale .3s}
.lu:hover img{animation-play-state:paused;translate:0 -10px;scale:1.05}
@keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero h1{animation:heroIn .8s cubic-bezier(.2,.7,.2,1) both}
.hero-copy>div{animation:heroIn .8s .15s cubic-bezier(.2,.7,.2,1) both}
.card .ph img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.07) rotate(-1deg)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px -18px rgba(20,27,92,.45)}
.card{transition:border-color .2s, transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s}
.upc{overflow:hidden}
.upc img{transition:transform .7s cubic-bezier(.2,.7,.2,1), filter .4s}
.upc:hover img{transform:scale(1.06);filter:saturate(1.15)}
@keyframes slideImg{from{opacity:0;transform:translateX(40px) scale(1.03)}to{opacity:1;transform:none}}
.pd .ph img.sw{animation:slideImg .45s cubic-bezier(.2,.7,.2,1)}
.thumbs button{transition:transform .2s, border-color .2s}
.thumbs button:hover{transform:translateY(-3px)}
@keyframes shake{0%,84%,100%{transform:none}86%{transform:rotate(-3deg) scale(1.04)}88%{transform:rotate(3deg) scale(1.04)}90%{transform:rotate(-2deg)}92%{transform:rotate(2deg)}94%{transform:none}}
.dock a.pri,.pd .btns .btn-pri,.ask .btn-pri{animation:shake 4s ease-in-out infinite}
.btn-pri:hover{animation-play-state:paused}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,184,28,.6)}50%{box-shadow:0 0 0 7px rgba(255,184,28,0)}}
.badge:first-child{animation:pulse 2.4s ease-out infinite}
@keyframes fill{from{width:0}}
.bar i{animation:fill 1.2s cubic-bezier(.2,.7,.2,1) both}
.rev{transition:transform .3s, box-shadow .3s}
.rev:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px -18px rgba(20,27,92,.4)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.rv{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.fit{margin:14px 0 0;padding:10px 14px;border-left:4px solid #FFB81C;background:rgba(255,184,28,.12);border-radius:8px;font-weight:600}

<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#trang-chu" aria-label="ENERJOY, về trang chủ"></a>
    <nav class="nav" aria-label="Menu chính">
      <a href="#trang-chu" data-nav="trang-chu">Trang chủ</a>
      <a href="#san-pham" data-nav="san-pham">Sản phẩm</a>
      <a href="#lien-he" data-nav="lien-he">Đặt hàng</a>
    </nav>
    <a class="hot" id="hotline" href="#lien-he"></a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div><span class="logo" role="img" aria-label="ENERJOY" style="width:110px;margin-bottom:8px"></span><span id="ft-addr"></span></div>
    <ul class="ft-pol" id="ft-pol"></ul>
  </div>
</footer>

<nav class="dock" aria-label="Liên hệ nhanh">
  <a id="dk-call" href="#lien-he">Gọi</a>
  <a id="dk-zalo" href="#lien-he">Zalo</a>
  <a class="pri" href="#lien-he">Đặt hàng</a>
</nav>

<script src="products.js"></script>
<script>
(function(){
const S = window.SHOP, P = window.PRODUCTS, D = window.DEVICES, SO = window.SOLAR || [], ALL = P.concat(SO);
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const fmt = n => n.toLocaleString('vi-VN');
const priceText = v => v.price ? fmt(v.price) + 'đ' : 'Liên hệ';
const minWh = p => Math.min(...p.variants.map(v=>v.wh));
const codes = p => p.variants.map(v=>v.code).join(' / ');
const maxWh = p => Math.max(...p.variants.map(v=>v.wh));
const whRange = p => minWh(p)===maxWh(p) ? fmt(minWh(p)) : fmt(minWh(p))+' - '+fmt(maxWh(p));
let state = { filter:'all', variant:{}, qty:{}, photo:{} };
const ICON = (()=>{ const P={
  shield:'<path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6l-8-3z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/>'};
  const o={}; for(const k in P) o[k]=`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg></span>`; return o; })();


// cấu hình chung
$('#hotline').textContent = 'Hotline ' + S.phone;
$('#ft-addr').textContent = S.address;
$('#ft-pol').innerHTML = S.policies.map(x=>`<li>${x.title}</li>`).join('');
$('#dk-zalo').href = 'https://zalo.me/' + S.zalo;
$('#dk-zalo').target = '_blank';
$('#dk-call').href = 'tel:' + S.phone;

function badges(p){
  const b=[p.bestSeller&&'Bán chạy',p.sine&&'Sin chuẩn'].filter(Boolean);
  return b.length?`<span class="badges">${b.map(x=>`<span class="badge">${x}</span>`).join('')}</span>`:'';
}
const soldText = p => p.sold ? `Đã bán ${fmt(p.sold)}` : '';
const stars = n => '<span class="stars" aria-label="'+n+' sao">'+'★'.repeat(n)+'<span>'+'★'.repeat(5-n)+'</span></span>';
function reviews(){
  const R=window.REVIEWS||[]; if(!R.length) return '';
  return `<section class="blk" style="padding-top:0"><div class="wrap">
    <div class="blk-head"><h2>Khách nói gì sau khi dùng</h2></div>
    <div class="revs">${R.map(r=>`<figure class="rev">${stars(r.stars||5)}<blockquote>${r.text}</blockquote>
      <figcaption><div><b>${r.name}</b>${r.place?', '+r.place:''}</div><span>Mua máy ${r.product}${r.source?', đánh giá trên '+r.source:''}${r.date?', '+r.date:''}</span></figcaption></figure>`).join('')}</div>
  </div></section>`;
}
function tile(p,big){
  const tg=[p.bestSeller&&'<span>Bán chạy</span>',p.sine&&'<span class="o">Sin chuẩn</span>'].filter(Boolean).join('');
  const ac=(p.ports.find(x=>/AC/.test(x))||'').replace(/ổ AC/,'ổ AC');
  const info=`<div class="tg">${tg}</div><h3>ENERJOY ${fmt(p.watt)}W</h3>${big?`<div class="m">${p.useFor.join('. ')}.</div>`:''}
    <div class="cds">${p.variants.map(v=>`<b>${v.code}</b>`).join('')}</div><div class="wh"><small>${whRange(p)} Wh, ${ac}</small></div>${soldText(p)?`<div class="sm">${soldText(p)}</div>`:''}${big?'<span class="go">Xem máy</span>':''}`;
  const img=`<img src="${p.img}" alt="${p.name}" loading="lazy" width="1100" height="780">`;

// Công cụ: chọn thiết bị, tính số giờ chạy. Hiệu suất quy đổi 85%.
function calc(p, v){
  const qty = state.qty;
  const total = D.reduce((s,d,i)=>s+(qty[i]||0)*d.w,0);
  const devs = D.map((d,i)=>`<div class="dev"><div>${d.name}<div class="w">${d.w}W</div></div>
    <div class="qty"><button data-q="${i}" data-d="-1" aria-label="Bớt ${d.name}">−</button><output>${qty[i]||0}</output><button data-q="${i}" data-d="1" aria-label="Thêm ${d.name}">+</button></div></div>`).join('');
  let res;
  if(!total){ res = `<div class="note">Bấm + để thêm thiết bị nhà bạn hay dùng khi mất điện.</div>`; }
  else if(p){
    const h = v.wh*0.85/total;
    res = `<div><div class="big">${h>=1? h.toFixed(1).replace('.',',')+' giờ' : Math.round(h*60)+' phút'}</div><div class="note" style="flex-basis:auto">${v.code}, tổng tải ${fmt(total)}W</div></div>
      ${total>p.watt?`<div class="over">Tổng tải vượt ${fmt(p.watt)}W, nên chọn máy lớn hơn.</div>`:''}
      <div class="note">Ước tính theo dung lượng thực tế x 85% hiệu suất. Tủ lạnh chạy ngắt quãng nên thực tế lâu hơn.</div>`;
  } else {
    const fit = P.flatMap(pp=>pp.variants.map(vv=>({p:pp,v:vv,h:vv.wh*0.85/total}))).filter(x=>x.p.watt>=total*1.2);
    res = fit.length? `<div style="flex-basis:100%"><div class="tbl-wrap"><table><thead><tr><th>Máy</th><td style="color:var(--muted)">Chạy được khoảng</td></tr></thead><tbody>${fit.map(x=>`<tr><th><a href="#sp-${x.p.id}">${x.v.code}</a></th><td class="num">${x.h.toFixed(1).replace('.',',')} giờ</td></tr>`).join('')}</tbody></table></div></div>
      <div class="note">Tổng tải ${fmt(total)}W. Chỉ hiện máy có công suất dư ít nhất 20%. Ước tính theo Wh thực tế x 85%.</div>`
      : `<div class="over">Tổng tải ${fmt(total)}W vượt các dòng máy hiện có.</div>`;
  }
  return `<div class="calc" id="calc"><h3>${p?'Máy này chạy được bao lâu?':'Chọn thiết bị, xem máy nào phù hợp'}</h3>
    <p class="hint">Công suất thiết bị là số ước lượng phổ biến, xem nhãn máy nhà bạn để chính xác hơn.</p>
    <div class="devs">${devs}</div><div class="result">${res}</div></div>`;
}

  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.variant[cur().id]=+b.dataset.v;render(true);});
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.photo[cur().id]=+b.dataset.g;state.swapped=cur().id;render(true);state.swapped=null;});
  app.querySelectorAll('[data-order]').forEach(a=>a.addEventListener('click',()=>{state.order=a.dataset.order;}));
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=b.dataset.q;state.qty[i]=Math.max(0,(state.qty[i]||0)+ +b.dataset.d);
    const c=$('#calc'); const p=cur(); const html=calc(p, p&&p.variants[state.variant[p.id]??0]);
    const t=document.createElement('div');t.innerHTML=html;c.replaceWith(t.firstElementChild);bind();});
  const f=$('#order'); if(f) f.onsubmit=e=>{
    e.preventDefault();
    const name=$('#o-name').value.trim(), phone=$('#o-phone').value.trim();
    const out=$('#o-out'); out.hidden=false;
    if(!name||!phone){out.innerHTML='<p class="over" style="margin:0">Bạn điền giúp họ tên và số điện thoại nhé.</p>';return;}
    const body={name, phone, sku:$('#o-sku').value, qty:$('#o-qty').value, address:$('#o-addr').value.trim()};
    const msg=`ĐƠN HÀNG ENERJOY\nHọ tên: ${name}\nSĐT: ${phone}\nSản phẩm: ${body.sku} x ${body.qty}\nĐịa chỉ: ${body.address}`;
    if(!/^(\+?84|0)\d{9,10}$/.test(phone.replace(/[\s.]/g,''))){out.innerHTML='<p class="over" style="margin:0">Số điện thoại chưa đúng, kiểm tra lại giúp shop nhé.</p>';return;}
    // Đơn gửi qua Zalo của shop: copy nội dung đơn, khách mở Zalo và dán vào khung chat.
    // Zalo không cho điền sẵn tin nhắn qua link, nên phải copy rồi dán.
    const copy=()=>{const sel=()=>{const r=document.createRange();r.selectNodeContents($('#o-msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);};
      try{navigator.clipboard.writeText(msg).then(()=>{$('#o-copied').textContent='Đã copy nội dung đơn.';}).catch(sel);}catch(_){sel();}};
    out.innerHTML=`<div class="zalo-steps">
        <p style="margin:0 0 8px;font-weight:600">Còn 1 bước: gửi đơn này cho shop qua Zalo</p>
        <div class="out" id="o-msg">${msg.replace(/</g,'&lt;')}</div>
        <p id="o-copied" style="font-size:14px;color:var(--ok);margin:8px 0 4px"></p>
        <p style="font-size:14px;color:var(--muted);margin:0 0 12px">Bấm nút bên dưới để mở Zalo shop (số ${S.zalo}), dán nội dung đơn vào khung chat rồi bấm gửi. Shop sẽ gọi lại để xác nhận.</p>
        <div class="btns"><a class="btn btn-pri" href="https://zalo.me/${S.zalo}" target="_blank" rel="noopener">Mở Zalo và dán đơn</a><button class="btn btn-ghost btn-sm" type="button" id="o-recopy">Copy lại nội dung</button></div>
      </div>`;
    copy(); $('#o-recopy').onclick=copy;
  };
}

function cur(){ const h=location.hash.slice(1); return h.startsWith('sp-') ? ALL.find(p=>p.id===h.slice(3)) : null; }

function render(keepScroll){
  const h = location.hash.slice(1) || 'trang-chu';
  const p = cur();
  let page = 'trang-chu';
  if(p){ app.innerHTML = detail(p); page='san-pham'; document.title = p.name + ' | ENERJOY'; }
  else if(h==='san-pham'){ app.innerHTML = list(); page='san-pham'; document.title='Sản phẩm | ENERJOY'; }
  else if(h==='lien-he'){ app.innerHTML = contact(); page='lien-he'; document.title='Đặt hàng | ENERJOY'; }
  else { app.innerHTML = home(); document.title='ENERJOY Trạm Sạc'; if(h==='tinh-gio'){ requestAnimationFrame(()=>$('#tinh-gio').scrollIntoView()); keepScroll=true; } }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===page));
  bind();
  if(!keepScroll){ window.scrollTo(0,0); reveal(); }
}
function reveal(){
  if(!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px'});
  const groups=['.why>div','.uses-ph>.upc','.grid>.card','.bento>.tl','.revs>.rev','.faq details','.blk-head','.calc','.ask .wrap>*','.pd>*'];
  groups.forEach(sel=>app.querySelectorAll(sel).forEach((el,i)=>{
    el.classList.add('rv'); if(sel==='.pd>*') el.classList.add(i?'rv-r':'rv-l');
    el.style.setProperty('--d',(i%3)*0.08+'s'); io.observe(el);
  }));
}
addEventListener('hashchange',()=>render());
render();
})();
</script>
</body>
</html>
